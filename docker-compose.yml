services:
  postgres:
    image: postgres:16
    container_name: mcpilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mcpilot
      POSTGRES_USER: mcpilot
      POSTGRES_PASSWORD: mcpilot

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: